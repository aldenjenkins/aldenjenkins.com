<!DOCTYPE html>
<html>
  <head>
    <title>Alden Jenkins | {{ .Title }}
    </title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta property="og:title" content="{{ site.Params.ownerName }}">
    <meta name="author" content="{{ site.Params.ownerName }}">
    <meta property="og:locale" content="en_US">
    <meta name="description" content="{{ site.Params.description }}">
    <meta property="og:description" content="{{ site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ site.Params.ownerName }}">
    <meta property="og:image" content="{{ site.Params.ogImage | absURL }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="">
    <meta name="twitter:creator" content="@{{ site.Params.twitter }}">
    <meta name="twitter:title" content="{{ site.Params.ownerName }}">
    <meta name="twitter:description" content="{{ site.Params.description }}">
    <meta name="twitter:image" content="{{ site.Params.ogImage | absURL }}">
    <meta name="twitter:image:alt" content="{{ site.Params.ownerName }}">
    <link href="/favicon.ico" rel="shortcut icon" type="image/x-icon">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script type="application/ld+json">
        {"@context":"http://schema.org","@type":"WebSite","name":"{{ site.Params.ownerName }}","headline":"{{ site.Params.ownerName }}","author":{"@type":"Person","name":"{{ site.Params.ownerName }}"},"description":"{{ site.Params.description }}","url":"{{ site.BaseURL }}"}
    </script>
    <script defer="" src="https://use.fontawesome.com/releases/v5.0.6/js/all.js"></script>
